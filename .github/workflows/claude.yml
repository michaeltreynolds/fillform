name: Claude

# Lets an allowed person just open a GitHub issue and have Claude read it,
# ask questions if needed, make the change, commit it straight to main, and
# tell them how to test it. A follow-up comment that mentions @claude keeps
# the conversation going.
#
# SECURITY — this repo is PUBLIC, so anyone on GitHub can open an issue.
# Claude only runs for the usernames in the allow-list below. Everyone else
# is silently ignored (their issue just sits there; no run, no cost).
#
#   >>> TO LET SOMEONE NEW TRIGGER CLAUDE (e.g. Chris once he has a GitHub
#   >>> account): add their exact GitHub username to the ALLOW-LIST below.
#   >>> e.g.  '["michaeltreynolds"]'  ->  '["michaeltreynolds","chris-username"]'
#
# One-time setup (see repo Settings):
#   1. Run `claude setup-token` locally and copy the token it prints.
#   2. Add it as a repo secret named CLAUDE_CODE_OAUTH_TOKEN.
#   3. Install the Claude GitHub App on this repo.

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: write        # commit/push changes to main
  pull-requests: write   # comment on PRs
  issues: write          # comment on issues
  id-token: write        # required by the action

jobs:
  claude:
    # Run when an allow-listed user either opens an issue OR mentions @claude in
    # a comment. `comment.user.login` is empty on the `issues` event, so the
    # `||` falls back to the issue opener; on comment events it is the commenter.
    if: >
      contains(fromJSON('["michaeltreynolds"]'), github.event.comment.user.login || github.event.issue.user.login) &&
      (github.event_name == 'issues' || contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: anthropics/claude-code-action@v1
        env:
          # Lets Claude use the `gh` CLI (git/PR/issue ops) from Bash, authenticated.
          GH_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # By default the action blocks arbitrary Bash, so Claude can't run git or
          # gh — which it needs to commit to main and comment on the issue. Triggers
          # are already limited to the allow-list above, so granting Bash is safe.
          claude_args: |
            --allowedTools "Edit,Write,Read,Glob,Grep,Bash"
          prompt: |
            You are helping a non-technical collaborator who describes a bug or a
            desired feature in plain language, either by opening an issue or by
            commenting on one. Below is the relevant context (some fields may be
            empty depending on whether this was a new issue or a follow-up comment).

            Issue #${{ github.event.issue.number }}
            Title: ${{ github.event.issue.title }}
            Body:
            ${{ github.event.issue.body }}

            Latest comment (if this was triggered by a comment):
            ${{ github.event.comment.body }}

            Do the following:
            1. Read the relevant parts of the codebase to understand the request.
            2. If anything important is unclear or you need a decision, comment on
               the issue asking specific, plain-language questions, then stop. Do
               not guess at ambiguous requirements. End such a comment by telling
               the reporter to reply and start their message with "@claude" so
               you'll see the answer.
            3. If the request is clear enough, make the change and commit it to the
               main branch with git:
                 git add -A
                 git commit -m "<short summary of the change>"
                 git push origin HEAD:main
            4. Finish by commenting on the issue with a plain-language summary of
               what you changed and clear, step-by-step test instructions (avoid
               jargon). Post it with the gh CLI, e.g.:
                 gh issue comment ${{ github.event.issue.number }} --body "<your summary>"
